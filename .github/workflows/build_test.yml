name: Build and Test
on:
  pull_request:
    branches: ["main", "dev"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Generate Cloudflare Worker types
        run: npm run cf-typegen
      - name: Type check
        run: npm run typecheck
      - name: Run tests
        run: npm run test:run
      - name: Lint
        run: npm run lint
      - name: Build project
        run: npm run build
