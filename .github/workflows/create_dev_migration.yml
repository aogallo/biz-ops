name: Create Dev Migrations
on:
  push:
    branches:
      - dev
jobs:
  create_dev_migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          npm run db:migrate:ci
