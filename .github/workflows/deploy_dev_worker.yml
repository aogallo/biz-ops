name: Deploy Worker
on:
  push:
    branches:
      - dev
jobs:
  deploy:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Debug DB
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          node -e "console.log(new URL(process.env.DATABASE_URL).hostname)"
      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          npm run db:migrate:ci
      - name: Seed super admin (dev)
        if: github.ref == 'refs/heads/dev'
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          SUPER_ADMIN_EMAIL: ${{ secrets.DEV_SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.DEV_SUPER_ADMIN_PASSWORD }}
          SUPER_ADMIN_NAME: "Dev Super Admin"
        run: npm run db:seed:super-admin
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            BETTER_AUTH_SECRET
            BETTER_AUTH_URL
            DATABASE_URL
            RESEND_API_KEY
            EMAIL_FROM
        env:
          BETTER_AUTH_SECRET: ${{ secrets.DEV_BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.DEV_BETTER_AUTH_URL }}
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.DEV_RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.DEV_EMAIL_FROM }}
